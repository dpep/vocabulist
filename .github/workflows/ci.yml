# One toolchain, no matrix — the job name is the required status-check context
# ("Rust"). If you test multiple toolchains, the check names change and the
# branch-protection contexts must be updated to match.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, edited, synchronize ]

jobs:
  test:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: clone ${{ github.repository }}
        uses: actions/checkout@v7

      - name: setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      # The backstop dictionary is the system word list, which Ubuntu runners
      # don't ship. Without it the checker degrades to lexicon-only and the
      # tests covering the dictionary path would quietly stop exercising it.
      - name: install word list
        run: sudo apt-get update && sudo apt-get install -y wamerican

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: build
        run: cargo build --all-targets

      - name: test
        run: cargo test
